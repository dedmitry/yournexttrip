<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FF7A1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YourNextTrip" />
    <link rel="apple-touch-icon" href="/android-chrome-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <!-- Basic -->
    <title>YourNextTrip – Plan your perfect trip</title>

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Telegram…) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="YourNextTrip">
    <meta property="og:url" content="https://your-next-trip.netlify.app/">

    <meta property="og:image" content="https://your-next-trip.netlify.app/preview-image.png">

    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
